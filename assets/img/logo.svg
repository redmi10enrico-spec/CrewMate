<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="CrewMate Network">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#3fc9ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="200" rx="20" fill="#0a1428"/>
  <rect x="6" y="6" width="388" height="188" rx="16" fill="none" stroke="#1a8fd4" stroke-width="2" opacity="0.5"/>
  <!-- blocchi decorativi -->
  <rect x="40" y="40" width="16" height="16" fill="#3fc9ff" opacity="0.7"/>
  <rect x="345" y="55" width="14" height="14" fill="#5fd35f" opacity="0.7"/>
  <rect x="360" y="130" width="12" height="12" fill="#3fc9ff" opacity="0.6"/>
  <text x="200" y="98" font-family="'Press Start 2P', monospace" font-size="34" font-weight="700"
        fill="url(#g)" text-anchor="middle" filter="url(#glow)">CREWMATE</text>
  <text x="200" y="140" font-family="Segoe UI, sans-serif" font-size="20" letter-spacing="8"
        fill="#9fb3cc" text-anchor="middle">NETWORK</text>
</svg>
